<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Experience Photo Check | JunHao</title><style>body{background:#0d0b15;color:#f2eafb;font:15px/1.6 system-ui,sans-serif;max-width:950px;margin:0 auto;padding:24px}a{color:#c9b0ff}h1{font-size:26px}table{width:100%;border-collapse:collapse}td,th{padding:13px 8px;border-bottom:1px solid #423852;text-align:left}img{display:block;width:100%;max-width:220px;height:140px;object-fit:contain;background:#1e1928;border-radius:9px}.ok{color:#87edbf}.bad{color:#ffaeaa}code{font-size:12px}small{color:#afa4c0}</style></head><body><p><a href="index.html">← 返回 Portfolio</a></p><h1>Journey / Experience 照片检查</h1><p>检查照片有没有上传到 GitHub Pages，以及能否正确解码。图片路径和文件名大小写必须一致。</p><table><thead><tr><th>名称</th><th>状态</th><th>预览</th></tr></thead><tbody id="checks"></tbody></table><p><small>支持 .jpg、.jpeg、.png、.webp（包括大写扩展名）。请确认 GitHub Desktop 已执行 Commit / Push，GitHub Actions 为绿色成功。</small></p><script>
const files=['dms-freelance-01','dms-freelance-02','dms-intern-01','dms-intern-02'];
const exts=['jpg','jpeg','png','webp','JPG','JPEG','PNG','WEBP'];
files.forEach(name=>{const tr=document.createElement('tr');const label=document.createElement('td');const status=document.createElement('td');const thumb=document.createElement('td');label.textContent=name;status.textContent='正在检测…';tr.append(label,status,thumb);document.querySelector('#checks').append(tr);let i=0;const next=()=>{if(i===exts.length){status.textContent='NOT FOUND / 无法解码';status.className='bad';return;}const url='assets/media/experience/'+name+'.'+exts[i++];const probe=new Image();probe.onload=()=>{status.textContent='FOUND · '+url.split('.').pop();status.className='ok';const img=document.createElement('img');img.src=url;img.alt=name;thumb.append(img);const a=document.createElement('a');a.href=url;a.textContent='打开原图';a.target='_blank';a.rel='noopener';thumb.append(a);};probe.onerror=next;probe.src=url;};next();});
</script></body></html>
